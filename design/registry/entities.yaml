# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: chain_score
    status: active
    source: design/gdd/chain-propagation.md
    referenced_by:
      - design/gdd/chain-propagation.md
    variables:
      - destroyed_value
      - total_damage
      - chain_depth
    output_range: [0, 100000]
    expression: "(Σ destroyed_value × 100 + total_damage × 0.5) × chain_depth^1.5"
    notes: "Consumed by scoring/rating system. depth_bonus uses chain_depth^1.5. Output feeds into level-end rating calculation."
    added: 2026-05-20
    revised: ""

  - name: damage_formula
    status: active
    source: design/gdd/health-damage.md
    referenced_by:
      - design/gdd/health-damage.md
    variables:
      - impulse
      - type_factor
      - dtc
    output_range: [0, null]
    expression: "floor(impulse × type_factor × dtc)"
    notes: "Consumed by enemy AI, scoring, and analytics. type_factors: bullet=0.20, explosion=0.15, fragment=0.25, crush=0.30."
    added: 2026-05-21
    revised: ""

  - name: boss_damage
    status: active
    source: design/gdd/boss-ai.md
    referenced_by:
      - design/gdd/boss-ai.md
    variables:
      - impulse
      - type_factor
      - dtc_effective
      - vuln_mult
    output_range: [0, 3000]
    expression: "floor(impulse × type_factor × dtc_effective × vuln_mult)"
    notes: "Extends damage_formula. dtc_effective = 1.0 for crush, 0.0 for bullet (Pillar 4), 0.3 for explosion/fragment. vuln_mult = 2.0 during VULNERABLE else 1.0. Consumed by health-damage system."
    added: 2026-05-21
    revised: ""

  - name: stun_duration
    status: active
    source: design/gdd/enemy-ai.md
    referenced_by:
      - design/gdd/enemy-ai.md
    variables:
      - impulse
      - stun_threshold
      - BASE_STUN
      - FALLOFF_K
      - MAX_MULT
    output_range: [0.3, 1.2]
    expression: "BASE_STUN × clamp(1.0 + (max(impulse/stun_threshold-1, 0) / (max(impulse/stun_threshold-1, 0) + FALLOFF_K)) × (MAX_MULT-1.0), 0.75, 3.0)"
    notes: "Diminishing returns curve. Consumed by hit-detection for applying stun state. MAX_STUN hard cap at 1.2s."
    added: 2026-05-21
    revised: ""

