# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: game_state_management
    status: active
    api: "纯 TypeScript 实现（零引擎依赖）"
    not: "Cocos EventTarget / 外部 FSM 库 (XState 等)"
    adr: docs/architecture/adr-001-state-machine.md
    reason: "4 状态 8 转换的简单模型不需要引擎耦合或外部依赖；脱离 Cocos 运行时可单元测试"
    referenced_by:
      - docs/architecture/adr-001-state-machine.md
    added: "2026-05-10"
    revised: ""

  - purpose: platform_storage_abstraction
    status: active
    api: "IPlatformStorage 接口 + WeChatStorage / WebStorage 双实现（依赖注入切换）"
    not: "条件分支 (if wx) / cc.sys 统一抽象"
    adr: docs/architecture/adr-004-platform-adapter.md
    reason: "平台 API 隔离到适配器层——微信 API 变更仅影响 WeChatStorage.ts (~40行)，Web 预览可完整测试存储逻辑"
    referenced_by:
      - docs/architecture/adr-004-platform-adapter.md
    added: "2026-05-11"
    revised: ""

  - purpose: touch_coordinate_api
    status: active
    api: "touch.getUILocation() —— UI 坐标系，与 Canvas 设计分辨率一致"
    not: "touch.getLocation() (世界坐标) / touch.getLocationInView() (OpenGL 视口坐标)"
    adr: docs/architecture/adr-005-input-pipeline.md
    reason: "getUILocation() 返回与网格渲染坐标系一致的 UI 坐标——无需额外矩阵变换，减少延迟和出错概率"
    referenced_by:
      - docs/architecture/adr-005-input-pipeline.md
    added: "2026-05-11"
    revised: ""

  - purpose: data_flow_hybrid
    status: active
    api: "混合 Push/Pull —— 事件/变化通知用 subscribe() 推送，状态查询/快照用 getter() 拉取"
    not: "全 Push (Event Sourcing) / 全 Pull (轮询) / 全局 EventBus"
    adr: docs/architecture/adr-003-data-flow.md
    reason: "\"谁变了就 Push，谁想知道就 Pull\"——11 系统的极简游戏不需要 event sourcing 或全局总线"
    referenced_by:
      - docs/architecture/adr-003-data-flow.md
    added: "2026-05-11"
    revised: ""

  - purpose: grid_rendering_graphics
    status: active
    api: "cc.Graphics (rect+fill/stroke) + cc.Label 节点池 (SystemFont 14px)"
    not: "Sprite 节点方案 / RenderTexture 离屏缓存 / 混合方案"
    adr: docs/architecture/adr-002-grid-rendering.md
    reason: "极简几何风定位——纯代码绘制与视觉方向一致；零纹理资源节省包体；100 格 Graphics 重绘 <3ms"
    referenced_by:
      - docs/architecture/adr-002-grid-rendering.md
    added: "2026-05-11"
    revised: ""

  - purpose: level_data_loading
    status: active
    api: "resources.load('levels', JsonAsset) —— 单 JSON 文件全量加载全部 50 关"
    not: "Asset Bundle 按章分包 / 远程配置下发 / JSON Schema 库 (ajv)"
    adr: docs/architecture/adr-006-level-data-schema.md
    reason: "50 关 ~25KB 全量加载内存 <100KB——分包和远程下发的复杂度远超收益；手写校验函数 ~100 行零依赖，节省 ajv 的 ~30KB 包体"
    referenced_by:
      - docs/architecture/adr-006-level-data-schema.md
    added: "2026-05-11"
    revised: ""

  - purpose: audio_preload_degradation
    status: active
    api: "resources.load() 预加载音频 + _lastFramePlayed 帧计数器防抖（同帧合并）"
    not: "节流（setInterval 定时器）/ 队列播放（Queue 消费方案）"
    adr: docs/architecture/adr-010-audio-preload-degradation.md
    reason: "同帧防抖用单行整数比较解决快速滑动的音效堆叠问题；节流和队列方案增加了定时器或队列复杂度，但同帧防抖已覆盖所有实际需求"
    referenced_by:
      - docs/architecture/adr-010-audio-preload-degradation.md
    added: "2026-05-11"
    revised: ""

