# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: scene-manager
    status: active
    budget_ms: 2000
    adr: docs/architecture/adr-0002-scene-loading-strategy.md
    notes: "场景加载（卸载旧 + 加载新）总耗时目标 ≤ 2s（中端移动设备）；死亡重置 ≤ 0.1s"
    referenced_by:
      - docs/architecture/adr-0002-scene-loading-strategy.md
    added: 2026-05-22
    revised: ""

  - system: physics-object-pool
    status: active
    budget_ms: 0.5
    adr: docs/architecture/adr-0003-physics-object-pool.md
    notes: "acquire_*() / release_*() 操作 <0.01ms/次；最坏情况（FIFO 回收遍历 50 个活跃对象）<0.05ms。总帧预算 <0.5ms"
    referenced_by:
      - docs/architecture/adr-0003-physics-object-pool.md
    added: 2026-05-22
    revised: ""

  - system: hit-detection
    status: active
    budget_ms: 0.5
    adr: docs/architecture/adr-0004-hit-detection.md
    notes: "build_hit_data() + emit hit_detected <0.01ms/次。峰值 50 次/帧（20 子弹 + 30 碎片 AOE）= <0.5ms 总开销"
    referenced_by:
      - docs/architecture/adr-0004-hit-detection.md
    added: 2026-05-22
    revised: ""

  - system: material-destruction
    status: active
    budget_ms: 0.2
    adr: docs/architecture/adr-0005-material-destruction-pipeline.md
    notes: "_on_hit() 每次 <0.001ms（Dictionary 查表）。破坏时 acquire_debris() × N <0.1ms。总帧预算 <0.2ms"
    referenced_by:
      - docs/architecture/adr-0005-material-destruction-pipeline.md
    added: 2026-05-22
    revised: ""

  - system: chain-propagation
    status: active
    budget_ms: 2.0
    adr: docs/architecture/adr-0006-chain-propagation-recursion.md
    notes: "Phase 1 物理判定同帧完成——最坏情况（深度 20 × 10 objects = 200 次 shape query 处理）<2.0ms。正常游戏场景（深度 3-8，30-80 次命中）0.5-1.0ms。Phase 2 视觉播放每 3 帧一次 signal emit <0.01ms"
    referenced_by:
      - docs/architecture/adr-0006-chain-propagation-recursion.md
    added: 2026-05-22
    revised: ""

  - system: shooting-system
    status: active
    budget_ms: 0.1
    adr: docs/architecture/adr-0007-bullet-lifecycle.md
    notes: "fire() 单次 <0.02ms（pool acquire + config + velocity）。_on_bullet_hit() <0.02ms（build_hit_data + deferred hit_stop）。20 颗活跃子弹的 _integrate_forces 开销由 Godot 物理引擎内部处理——不在 GDScript 层"
    referenced_by:
      - docs/architecture/adr-0007-bullet-lifecycle.md
    added: 2026-05-22
    revised: ""

  - system: weapon-system
    status: active
    budget_ms: 0.01
    adr: docs/architecture/adr-0008-weapon-system-ammo.md
    notes: "fire_current() 单次 <0.005ms（CD 数值比较 + Dictionary 查表 + 委托）。CD 拒绝路径 <0.001ms。reload Tween 零 CPU 开销"
    referenced_by:
