# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: room_scene_switching
    status: active
    api: SceneTree.change_scene_to_file()
    not: PackedScene.instantiate() + manual node management
    adr: docs/architecture/adr-0002-scene-loading-strategy.md
    reason: "Autoload 系统（ADR-0001）在 change_scene_to_file() 期间存活——不需要手动管理持久节点。Godot 原生场景切换，代码量 <100 行 vs 手动管理 >200 行。"
    referenced_by:
      - docs/architecture/adr-0002-scene-loading-strategy.md
    added: 2026-05-22
    revised: ""

  - purpose: alpha_preloading
    status: active
    api: ResourceLoader.load_threaded_request() + SceneTree.change_scene_to_packed()
    not: N/A — MVP 不实现预加载，接口预留
    adr: docs/architecture/adr-0002-scene-loading-strategy.md
    reason: "Alpha 阶段若需后台预加载，此为 Godot 4.6 标准路径。SceneManager 接口已预留 preload_room() / cancel_preload()。"
    referenced_by:
      - docs/architecture/adr-0002-scene-loading-strategy.md
    added: 2026-05-22
    revised: ""

  - purpose: debris_creation
    status: active
    api: PhysicsObjectPool.acquire_debris()
    not: PackedScene.instantiate()
    adr: docs/architecture/adr-0003-physics-object-pool.md
    reason: "碎片 RigidBody2D 从预分配池获取——避免 _physics_process 中的运行时分配尖峰。池容量 50，FIFO 回收。"
    referenced_by:
      - docs/architecture/adr-0003-physics-object-pool.md
    added: 2026-05-22
    revised: ""

  - purpose: projectile_creation
    status: active
    api: PhysicsObjectPool.acquire_projectile()
    not: PackedScene.instantiate()
    adr: docs/architecture/adr-0003-physics-object-pool.md
    reason: "子弹 RigidBody2D 从预分配池获取——保持碎片/子弹创建路径一致。池容量 20，CCD 预启用。"
    referenced_by:
      - docs/architecture/adr-0003-physics-object-pool.md
      - docs/architecture/adr-0007-bullet-lifecycle.md
    added: 2026-05-22
    revised: ""

  - purpose: bullet_hit_detection
    status: active
    api: PhysicsDirectBodyState2D.get_contact_*() in _integrate_forces() + custom collision_hit signal
    not: RigidBody2D.body_entered signal
    adr: docs/architecture/adr-0004-hit-detection.md
    reason: "body_entered 仅传递 Node 引用——不提供 hit_point/hit_normal/impulse。_integrate_forces(state) 通过 state.get_contact_collider_position/normal/impulse(idx) 提供完整碰撞数据。"
    referenced_by:
      - docs/architecture/adr-0004-hit-detection.md
    added: 2026-05-22
    revised: ""

  - purpose: aoe_detection
    status: active
    api: PhysicsDirectSpaceState2D.intersect_shape() + PhysicsShapeQueryParameters2D.exclude
    not: Area2D.area_entered / body_entered
    adr: docs/architecture/adr-0004-hit-detection.md
    reason: "intersect_shape() 返回范围内所有碰撞体——每个独立产生 HitData。exclude_rids 排除发射源自身。Area2D 方式需 140+ 额外子节点且无 CCD 支持。"
    referenced_by:
      - docs/architecture/adr-0004-hit-detection.md
    added: 2026-05-22
    revised: ""

  - purpose: enemy_vision_raycast
    status: active
    api: PhysicsRayQueryParameters2D + PhysicsDirectSpaceState2D.intersect_ray()
    not: RayCast2D node
    adr: docs/architecture/adr-0004-hit-detection.md
    reason: "每 0.2s 3 条射线——直接 API 查询效率更高。不走 hit_detected signal（感知射线非战斗命中）。"
    referenced_by:
      - docs/architecture/adr-0004-hit-detection.md
    added: 2026-05-22
    revised: ""

  - purpose: material_destruction_tracking
    status: active
    api: MaterialDestruction._accumulated_damage Dictionary (instance_id → float)
    not: Godot PhysicsMaterial damage system
    adr: docs/architecture/adr-0005-material-destruction-pipeline.md
    reason: "GodotPhysics2D 无内置材质破坏/损伤累积概念。自定义 Dictionary 追踪 + 材质阈值 JSON 配置实现 5 种材质的差异化规则。"
    referenced_by:
      - docs/architecture/adr-0005-material-destruction-pipeline.md
    added: 2026-05-22
    revised: ""

  - purpose: boss_movement
    status: active
    api: RigidBody2D._integrate_forces() + state.linear_velocity
    not: CharacterBody2D.move_and_slide()    # 禁止用于 Boss 根节点——需独立 RigidBody2D 子节点
    adr: docs/architecture/adr-0012-boss-body-part-architecture.md
    reason: "CharacterBody2D + top_level RigidBody2D 子节点存在根本性缺陷——手动位置同步每帧擦除 PhysicsServer impulse 效果。RigidBody2D + _integrate_forces 原生支持子节点 PinJoint2D 物理响应。"
    referenced_by:
      - docs/architecture/adr-0012-boss-body-part-architecture.md
    added: 2026-05-23
    revised: ""

  - purpose: boss_body_part_connection
    status: active
    api: PinJoint2D (softness=0.1-0.5)
    not: RigidBody2D.top_level = true          # 禁止——手动同步覆盖物理积分
    adr: docs/architecture/adr-0012-boss-body-part-architecture.md
    reason: "PinJoint2D 原生支持关节约束——部件与根节点共享物理空间，外部 impulse 通过关节自然传递。top_level=true 脱离父级 transform 但需手动同步——PhysicsServer 与手动 transform 赋值的竞争条件导致 impulse 仅存活一帧。"
    referenced_by:
      - docs/architecture/adr-0012-boss-body-part-architecture.md
    added: 2026-05-23
    revised: ""

  - purpose: enemy_navigation_cbody2d
    status: active
    api: NavigationAgent2D + move_and_slide() (RVO2 enabled: 侦察兵/士兵; RVO2 disabled: 重装兵)
    not: manual GDScript A* pathfinding
    adr: docs/architecture/adr-0013-enemy-navigation.md
    reason: "NavigationAgent2D 在 Godot C++ NavigationServer2D 层执行 A* 寻路——15 agent <0.1ms vs GDScript A* 3-5ms。RVO2 自动维持 80-150px 间距。重装兵无需避让——碾压移动。"
    referenced_by:
      - docs/architecture/adr-0013-enemy-navigation.md
    added: 2026-05-23
    revised: ""

  - purpose: enemy_navigation_rbody2d
    status: active
    api: direct movement + RayCast2D wall avoidance
    not: NavigationAgent2D + RVO2 (Carrier)     # 禁止——_integrate_forces() 与 velocity_computed signal 不兼容
    adr: docs/architecture/adr-0013-enemy-navigation.md
    reason: "NavigationAgent2D velocity_computed signal 在 _integrate_forces() 调用栈外触发——无法在 physics step 内安全地设置 state.linear_velocity。Carrier 行为简单（冲向玩家+爆炸），直接移动+射线避障即满足需求。"
    referenced_by:
      - docs/architecture/adr-0013-enemy-navigation.md
    added: 2026-05-23
    revised: ""

