# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: state_transition
    status: active
    pattern: direct_call
    producer: game-state-machine
    consumers:
      - grid-connection-engine
      - scene-manager
      - input-manager
      - in-game-hud
      - level-complete-overlay
      - audio-manager
    adr: docs/architecture/adr-001-state-machine.md
    signal_signature: "onEnter(state: GameState, cb: StateCallback): () => void; onExit(state: GameState, cb: StateCallback): () => void"
    referenced_by:
      - docs/architecture/adr-001-state-machine.md
    added: "2026-05-10"
    revised: ""

  - contract: storage_access
    status: active
    pattern: direct_call
    producer: platform-adapter
    consumers:
      - local-storage
    adr: docs/architecture/adr-004-platform-adapter.md
    signal_signature: "IPlatformStorage.set(key: string, value: string): void; get(key: string): string | null; remove(key: string): void; getInfo(): StorageInfo"
    referenced_by:
      - docs/architecture/adr-004-platform-adapter.md
    added: "2026-05-11"
    revised: ""

  - contract: input_events
    status: active
    pattern: direct_call
    producer: input-manager
    consumers:
      - grid-connection-engine
    adr: docs/architecture/adr-005-input-pipeline.md
    signal_signature: "subscribe(cb: (type: InputEventType, coord: GridCoord) => void): () => void"
    referenced_by:
      - docs/architecture/adr-005-input-pipeline.md
    added: "2026-05-11"
    revised: ""

  - contract: level_data_access
    status: active
    pattern: direct_call
    producer: level-data-schema
    consumers:
      - grid-connection-engine
      - step-scoring
      - level-select-ui
    adr: docs/architecture/adr-006-level-data-schema.md
    signal_signature: "ILevelDataProvider.getLevel(id: number): Level | null; getLevelCount(): number; loadLevels(): Promise<LevelData>"
    referenced_by:
      - docs/architecture/adr-006-level-data-schema.md
    added: "2026-05-11"
    revised: ""

  - contract: audio_playback
    status: active
    pattern: direct_call
    producer: audio-manager
    consumers:
      - grid-connection-engine
      - game-state-machine
    adr: docs/architecture/adr-010-audio-preload-degradation.md
    signal_signature: "play(eventId: AudioEventId): void; setMuted(muted: boolean): void; isMuted(): boolean"
    referenced_by:
      - docs/architecture/adr-010-audio-preload-degradation.md
    added: "2026-05-11"
    revised: ""

