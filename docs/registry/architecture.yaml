# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_state_write
    status: active
    description: "系统必须通过 GameStateMachine.transition() 触发状态转换，禁止直接修改 currentState 字段或绕过状态机进行状态切换"
    why: "绕过状态机会跳过 onEnter/onExit 回调链，导致系统处于不一致状态（如引擎在非 Playing 态运行）"
    adr: docs/architecture/adr-001-state-machine.md
    added: "2026-05-10"

  - pattern: direct_wx_api_call
    status: active
    description: "系统禁止直接调用 wx.setStorage / wx.getStorage / wx.removeStorage —— 必须通过 IPlatformStorage 接口访问存储"
    why: "直接调用 wx.* 使平台代码散布在业务逻辑中——Web 预览崩溃、微信 API 变更需修改多个文件、存储策略与平台调用混杂"
    adr: docs/architecture/adr-004-platform-adapter.md
    added: "2026-05-11"

  - pattern: direct_touch_listener
    status: active
    description: "引擎和其他系统禁止直接在 Cocos Node 上注册 TOUCH_MOVE/TOUCH_START/TOUCH_END —— 必须通过 IInputManager.subscribe() 获取已处理的网格坐标输入"
    why: "直接监听原始触摸事件绕过坐标映射和状态守卫——导致引擎与其他系统需要各自处理像素坐标转换，不可测试且重复实现"
    adr: docs/architecture/adr-005-input-pipeline.md
    added: "2026-05-11"

  - pattern: push_poll_duality
    status: active
    description: "同一数据禁止同时暴露 Push (subscribe) 和 Pull (getter) 给同一消费者——必须选一种且仅一种"
    why: "双重真理源——当 Push 推送的值与 Pull 查询的值不一致时（中间状态），消费者无法判断哪个是正确的"
    adr: docs/architecture/adr-003-data-flow.md
    added: "2026-05-11"

  - pattern: push_chain_depth_3
    status: active
    description: "Push 回调链深度不得超过 3 层（A subscribe → B subscribe → C subscribe → D 禁止）"
    why: "超过 3 层的 Push 链导致单帧延迟累积和调试困难——第 4 层必须改用 Pull 读取"
    adr: docs/architecture/adr-003-data-flow.md
    added: "2026-05-11"

  - pattern: sprite_per_cell
    status: active
    description: "禁止每格使用独立 Sprite 节点渲染网格单元——必须通过 cc.Graphics 程序化绘制"
    why: "100 个 Sprite Node = 100 draw call + 100 Cocos 对象，违反 <20 draw call 预算和极简几何风定位"
    adr: docs/architecture/adr-002-grid-rendering.md
    added: "2026-05-11"

