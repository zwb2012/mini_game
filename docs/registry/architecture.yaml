# ADR-0006 写入记录: chain_step_processed, chain_ended, chain_started, chain_depth_milestone 4 个 signal 契约 + chain-propagation 性能预算

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: game_state
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0010-game-state-machine.md
    interface: "GameStateMachine.current_state (read-only GameState enum — 5 值: MAIN_MENU, PLAYING, PAUSED, DEAD, LEVEL_COMPLETE)"
    write_access: game-state-machine-only  # 唯一写入入口: transition_to()
    referenced_by:
      - docs/architecture/adr-0010-game-state-machine.md
      - docs/architecture/adr-0002-scene-loading-strategy.md   # 读取状态决定加载/重置
    added: 2026-05-23
    revised: ""

# Example:
#
# state_ownership:
