# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: manual_room_node_management
    status: active
    description: "禁止使用 PackedScene.instantiate() + 手动 add_child/queue_free 管理房间场景。必须使用 SceneTree.change_scene_to_file() 进行房间切换。"
    why: "ADR-0001 已将 UI 系统设为 Autoload——手动管理持久根场景的架构优势不复存在。额外 ~200 行生命周期代码增加维护负担而无实质收益。"
    adr: docs/architecture/adr-0002-scene-loading-strategy.md
    added: 2026-05-22

  - pattern: direct_runtime_rigidbody_instantiation
    status: active
    description: "禁止任何系统直接调用 PackedScene.instantiate() 创建碎片或子弹 RigidBody2D。必须通过 PhysicsObjectPool.acquire_debris() / acquire_projectile() 从预分配池获取。"
    why: "运行时 instantiate() 在移动端造成帧尖峰（1-5ms），违反 60fps 目标。对象池将分配开销移至启动阶段，且 FIFO 回收天然限制活跃 RigidBody2D 数量。"
    adr: docs/architecture/adr-0003-physics-object-pool.md
    added: 2026-05-22

  - pattern: direct_godot_collision_callback_access
    status: active
    description: "禁止任何下游系统直接连接 RigidBody2D.body_entered 或使用 Godot 物理回调。所有碰撞事件必须通过 HitDetection.hit_detected signal 统一消费。"
    why: "body_entered 不提供碰撞位置/法线/冲量数据——直接使用会导致下游收到不完整数据。集中式 hit_detected signal 确保所有消费者得到完整的 9 字段 HitData。"
    adr: docs/architecture/adr-0004-hit-detection.md
    added: 2026-05-22

  - pattern: hardcoded_material_thresholds
    status: active
    description: "禁止在代码中硬编码材质破坏阈值（threshold）、碎片数（debris_count）、裂缝阶段数（crack_stages）。所有材质参数必须从 assets/data/materials/material_config.json 读取。"
    why: "Pillar 3（规则稳定、材质行为可学习）要求材质参数可被关卡设计师和平衡设计师不重新编译调整。硬编码阈值会导致调优周期延长（改代码→重新编译→重新部署）。"
    adr: docs/architecture/adr-0005-material-destruction-pipeline.md
    added: 2026-05-22

  - pattern: direct_game_state_write
    status: active
    description: "禁止任何系统直接修改 `GameStateMachine._current_state` 或绕过 `transition_to()` 切换游戏状态。所有状态切换必须通过 `GameStateMachine.transition_to()` 方法。"
    why: "集中式状态机是游戏状态的唯一权威源——直接写入会绕过合法转换白名单验证，导致非法状态切换（如 DEAD → PAUSED）和不可调试的行为不一致。"
    adr: docs/architecture/adr-0010-game-state-machine.md
    added: 2026-05-23

  - pattern: direct_camera_offset_write
    status: active
    description: "禁止任何系统直接修改 Camera2D.offset 属性。所有屏幕震动必须通过 `CameraSystem.shake(intensity, duration)` 方法触发。"
    why: "CameraSystem 管理震动优先级叠加策略（取最大强度 + 重新开始计时）——直接写入 offset 会绕过此策略，导致震动幅度爆炸或多系统同时写入 offset 互相覆盖。"
    adr: docs/architecture/adr-0011-camera-system.md
    added: 2026-05-23

  - pattern: direct_time_scale_manipulation
    status: active
    description: "禁止任何系统直接修改 `Engine.time_scale`。所有慢动作效果必须通过 `CameraSystem.hit_stop(duration, time_scale)` 方法触发。"
    why: "CameraSystem 使用 `create_timer(process_always=true)` 确保 time_scale 恢复不受自身影响——直接修改 time_scale 可能导致恢复逻辑错误（time_scale=0 时 Tween 完全停止）。集中式管理确保恢复行为可预测。"
    adr: docs/architecture/adr-0011-camera-system.md
    added: 2026-05-23

  - pattern: top_level_body_part_sync
    status: active
    description: "禁止使用 `RigidBody2D.top_level = true` + `_physics_process` 手动全局位置同步管理 Boss 身体部件。所有身体部件必须通过 PinJoint2D 关节与根节点连接。"
    why: "手动位置同步每帧覆盖 PhysicsServer 的 impulse 积分结果——外部冲击力施加到 RigidBody2D 上仅存活一帧即被位置赋值擦除。部件永远无法积累有效速度或产生可观物理偏移，与 GDD 核心需求'身体部件正常接受外部冲击力'根本冲突。引擎专家确认此为 API 设计层面的固有竞争条件，非 bug。"
    adr: docs/architecture/adr-0012-boss-body-part-architecture.md
    added: 2026-05-23

  - pattern: navigation_agent_with_rigidbody2d
    status: active
    description: "禁止在 RigidBody2D 敌人上使用 NavigationAgent2D + RVO2 避让。RigidBody2D 敌人（Carrier）必须使用直接移动 + RayCast2D 避障。"
    why: "NavigationAgent2D.velocity_computed signal 在 _integrate_forces() 调用栈外触发——无法在 physics step 内安全地设置 state.linear_velocity。RVO2 avoidance force 与 RigidBody2D 积分竞争控制权导致抖动。引擎专家确认此为 API 层面的不兼容。"
    adr: docs/architecture/adr-0013-enemy-navigation.md
    added: 2026-05-23

