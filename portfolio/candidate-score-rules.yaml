version: 1
language: zh-CN
purpose: 定义原始想法进入候选层后的结构化评估维度，以及 promote / hold / reject 规则。
dimensions:
  audience_pull:
    values:
      - high
      - medium
      - low
    description: 题材和用户需求的吸引力。
  platform_fit:
    values:
      - high
      - medium
      - low
    description: 是否适合微信小游戏等目标平台。
  monetization_fit:
    values:
      - high
      - medium
      - low
    description: 广告或其他变现方式是否自然。
  implementation_cost:
    values:
      - high
      - medium
      - low
    description: 实现与试错成本是否可控。
  differentiation:
    values:
      - high
      - medium
      - low
    description: 与现有方向相比是否足够差异化。
  content_burden:
    values:
      - high
      - medium
      - low
    description: 内容扩展、运营与素材补充压力是否过高。
rules:
  promote:
    - no_fatal_flags
    - at_least_two_high
    - platform_fit_not_low
    - monetization_fit_not_low
  hold:
    - uncertain_evidence
    - moderate_cost_or_diff
  reject:
    - platform_fit_low
    - monetization_fit_low
    - high_content_burden_and_low_differentiation
